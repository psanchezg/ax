# SonarQube — "ax" project (Go 1.27)
#
# Docs:
#   - Go analysis:     https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/languages/go/
#   - Coverage:        https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/test-coverage/go-test-coverage.md
#   - External issues: https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/importing-external-issues/external-analyzer-reports.md
#
# Usage: SONAR_TOKEN=sqp_xxx make sonar    (generates reports and analyzes)
#    or: sonar-scanner -Dsonar.host.url=... -Dsonar.login=$SONAR_TOKEN
# Note: the server is 9.9 LTS -> the token goes in sonar.login (sonar.token is 10.x+).
# Any -D on the CLI overrides what is set here.

sonar.projectKey=ax
sonar.projectName=ax

## ---------------------------------------------------------------------
## Scope
## ---------------------------------------------------------------------
# Scan the whole repo as sources so that go.mod/go.sum are included (the
# official docs state Go analysis is more precise with them); *_test.go
# files are reclassified as tests. Do not use sonar.sources=cmd,internal,...
# because that would leave go.mod out of the analysis.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

## ---------------------------------------------------------------------
## Exclusions (anything that is not analyzable Go code)
## ---------------------------------------------------------------------
sonar.exclusions=\
  **/*.pb.go,\
  **/vendor/**,\
  bin/**,\
  assets/**,\
  deploy/**,\
  docs/**,\
  examples/**,\
  **/*.md,\
  demo.sh,\
  .github/**,\
  .scannerwork/**,\
  cmd/ax-task-runner/__pycache__/**

# Generated code must not count against coverage or duplication
sonar.coverage.exclusions=**/*.pb.go
sonar.cpd.exclusions=**/*.pb.go

## ---------------------------------------------------------------------
## Coverage and test execution (generated by `make coverage`)
## ---------------------------------------------------------------------
# Atomic mode + -coverpkg=./... for real cross-package coverage
sonar.go.coverage.reportPaths=coverage.out
# Format: `go test -json` output (required by the Go test importer)
sonar.go.tests.reportPaths=test-report.out

## ---------------------------------------------------------------------
## golangci-lint (optional — enable with `make lint-report`)
## ---------------------------------------------------------------------
# The Go importer requires checkstyle format: --output.checkstyle.path=...
# sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

## ---------------------------------------------------------------------
## Misc
## ---------------------------------------------------------------------
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# In CI, fail the pipeline when the Quality Gate fails (or pass it on the CLI):
# sonar.qualitygate.wait=true

# Branch/PR analysis (requires Developer Edition+):
# sonar.branch.name=$(git branch --show-current)
# sonar.pullrequest.key=<pr-number>
# sonar.pullrequest.branch=<source-branch>
# sonar.pullrequest.base=<target-branch>
