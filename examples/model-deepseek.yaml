# A non-Gemini, OpenAI-compatible provider: DeepSeek.
#
# `provider: openai` selects the OpenAI-compatible chat-completions adapter, so
# the same manifest shape covers OpenRouter, Together, Groq, Fireworks, and
# Baseten. `baseURL` is the endpoint base, verbatim, including the API version
# prefix.
#
# Create the secret first (never commit real keys):
#
#   kubectl create secret generic deepseek-api-secret \
#     --from-literal=DEEPSEEK_API_KEY="<your-key>"
#
#   ax apply -f examples/model-deepseek.yaml
apiVersion: ax.io/v1alpha1
kind: Model
metadata:
  name: deepseek
  atespace: default
spec:
  provider: openai
  model: deepseek-chat
  baseURL: https://api.deepseek.com/v1
  secretKey:
    name: deepseek-api-secret
    key: DEEPSEEK_API_KEY
  parameters:
    # Gemini-style spellings are translated per provider, so one manifest keeps
    # working across providers.
    maxOutputTokens: 8000
    temperature: 0.2
