# A self-hosted, credential-less OpenAI-compatible endpoint (vLLM, Ollama,
# LM Studio, llama.cpp) reachable from the task's network.
#
# `secretKey` is omitted for local servers that do not check credentials; the
# adapter still sends an Authorization header, so a server that requires one
# needs a secret here like any other provider. Remember to allowlist the
# endpoint on the task's Gateway, otherwise egress is denied by default.
#
#   ax apply -f examples/model-local-qwen.yaml
apiVersion: ax.io/v1alpha1
kind: Model
metadata:
  name: local-qwen
  atespace: default
spec:
  provider: openai
  model: Qwen/Qwen3-Coder-30B-A3B-Instruct
  baseURL: http://vllm.default.svc.cluster.local:8000/v1
  parameters:
    maxOutputTokens: 4000
    temperature: 0.1
